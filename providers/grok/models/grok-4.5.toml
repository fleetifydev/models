name = "Grok 4.5"
family = "grok"
release_date = "2026-07-08"
last_updated = "2026-07-08"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = true

[cost]
input = 2.00
output = 6.00
cache_read = 0.30

[limit]
context = 500000
output = 30000

[modalities]
input = ["text", "image"]
output = ["text"]

[fleetify]
priority = 40
note = "Input/output pricing doubles for prompts at or above 200k tokens."
aliases = ["grok-4.5-latest"]

# Grok 4.5 always reasons: `none` is not an accepted effort.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "medium", "high", "xhigh"]
default = "high"
