name = "Grok 4.7"
family = "grok"
release_date = "2026-09-21"
last_updated = "2026-09-21"
knowledge = "2026-05"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = true

[cost]
input = 2.00
output = 6.00
cache_read = 0.50

# xAI documents no text output limit for Grok 4.7, so `output` is left unset.
[limit]
context = 500000

[modalities]
input = ["text", "image"]
output = ["text"]

[fleetify]
priority = 60
note = "Input/output pricing doubles for prompts at or above 200k tokens."

# Grok 4.7 always reasons: `none` is not an accepted effort.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "medium", "high", "xhigh"]
default = "high"
