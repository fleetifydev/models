name = "GLM 5.3 Flash"
family = "glm-flash"
release_date = "2026-10-22"
last_updated = "2026-10-22"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = true
open_weights = true

[cost]
input = 0.15
output = 0.50
cache_read = 0.03

[limit]
context = 1048576
output = 131072

[modalities]
input = ["text", "image"]
output = ["text"]

# Z.ai's open-weights model, hosted unmodified by Mistral.
[fleetify]
priority = 22

# Mistral documents `low`, `high` and `max` (`none` is rejected) for this
# model's `reasoning_effort`. The API default is not documented.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "high", "max"]
default = "high"
