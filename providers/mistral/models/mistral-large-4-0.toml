name = "Mistral Large 4"
family = "mistral-large"
release_date = "2026-10-06"
last_updated = "2026-11-05"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = true
open_weights = true

[cost]
input = 0.70
output = 2.10
cache_read = 0.07

[limit]
context = 1048576

[modalities]
input = ["text", "image"]
output = ["text"]

# GA since 2026-11-05 (version 26.10). Pinned id; `mistral-large-4` and
# `mistral-large-latest` also resolve here. The weights are published under
# the Mistral Ecosystem Open Weight License.
[fleetify]
priority = 35
aliases = ["mistral-large-4", "mistral-large-latest"]

# Mistral recommends starting at `high`. Large 4 rejects `none`, `minimal`,
# `xhigh` and `max`.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "medium", "high"]
default = "high"
