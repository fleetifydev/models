name = "Gemini 4 Hydrogen"
family = "gemini-hydrogen"
release_date = "2026-11-12"
last_updated = "2026-11-12"
knowledge = "2026-03"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = false

# Implicit caching only; one flat rate across the full 1M window. Also
# offered on the free tier.
[cost]
input = 1.50
output = 7.50
cache_read = 0.075

# 65,536 is the default synchronous cap; long decode (`background=true`) can
# raise it toward the full window.
[limit]
context = 1048576
output = 65536

[modalities]
input = ["text", "image", "video", "audio", "pdf"]
output = ["text"]

[fleetify]
priority = 120

# Hydrogen adds `xhigh` and defaults to `high`. `minimal` is rejected and
# thinking cannot be disabled.
[fleetify.effort]
kind    = "thinking_level"
levels  = ["low", "medium", "high", "xhigh"]
default = "high"
