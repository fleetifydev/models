name = "Gemini 4 Argon"
family = "gemini-argon"
release_date = "2026-10-13"
last_updated = "2026-10-13"
knowledge = "2026-03"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = false

# Implicit caching only; explicit cache writes are not offered.
[cost]
input = 2.00
output = 10.00
cache_read = 0.10

[limit]
context = 1048576
output = 65536

[modalities]
input = ["text", "image", "video", "audio", "pdf"]
output = ["text"]

# Paid tier only, so the free-tier-friendly default stays on 3.1 Pro.
[fleetify]
priority = 110
note = "Introductory pricing through 2026-11-30; $4.00 / $20.00 per MTok from 2026-12-01."

# `minimal` is rejected on Argon and thinking cannot be disabled.
[fleetify.effort]
kind    = "thinking_level"
levels  = ["low", "medium", "high"]
default = "medium"
