name = "GPT-6.1 Sol"
family = "gpt"
release_date = "2026-09-29"
last_updated = "2026-09-29"
knowledge = "2026-04-30"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = false

# Cache reads on GPT-6.1 Sol bill at 0.05x base input, not the usual 0.1x.
[cost]
input = 2.00
output = 10.00
cache_read = 0.10

[limit]
context = 1050000
output = 128000

[modalities]
input = ["text", "image"]
output = ["text"]

# Codex's default model since CLI 0.159.1. Held back from the `openai`
# provider: like GPT-6 Astra, its tool calling requires the Responses API.
[fleetify]
priority = 120
default = true

# No `none` effort; Codex defaults GPT-6.1 Sol to `low`. `ultra` is Codex's top
# tier: xhigh reasoning plus automatic task delegation.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "medium", "high", "xhigh", "max", "ultra"]
default = "low"
