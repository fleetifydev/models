name = "GPT-6.1 Terra"
family = "gpt"
release_date = "2026-10-26"
last_updated = "2026-10-26"
knowledge = "2026-06-01"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = false

[cost]
input = 1.00
output = 5.00
