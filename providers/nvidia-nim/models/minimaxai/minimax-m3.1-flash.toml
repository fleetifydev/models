name = "MiniMax M3.1 Flash"
family = "minimax"
release_date = "2026-10-19"
last_updated = "2026-10-20"
attachment = true
reasoning = true
tool_call = true
temperature = true
open_weights = true

[cost]
input = 0.00
output = 0.00

# NIM serves a 262,144-token window (MiniMax quotes 1M) and caps `max_tokens`
# at 65,536.
[limit]
context = 262144
output = 65536

[modalities]
input = ["text", "image", "video"]
output = ["text"]

# NIM's hosted request schema for this model documents `tools` but no
# `response_format`, so `structured_output` is left unset.
[fleetify]
priority = 91

# Always reasons; NIM's schema exposes no `reasoning_effort` control.
[fleetify.effort]
kind = "none"
