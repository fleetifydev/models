name = "Kimi K3"
family = "kimi-k3"
release_date = "2026-07-16"
last_updated = "2026-07-16"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = false
open_weights = true

[cost]
input = 3.00
output = 15.00
cache_read = 0.30

[limit]
context = 1048576
output = 1048576

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[fleetify]
priority = 30

# K3 always reasons; `reasoning_effort` selects the depth.
[fleetify.effort]
kind    = "levels"
levels  = ["low", "high", "max"]
default = "high"
